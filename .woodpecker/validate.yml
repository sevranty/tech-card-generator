when:
  - event: pull_request
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}

# TCG#31: repository-local validation for Tech Card Generator.
clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      partial: false
      depth: 0

steps:
  - name: repository-integrity
    image: alpine/git:2.47.2
    commands:
      - git diff --check
      - git fsck --no-progress
      - test -f README.md
      - test -f requirements-validation.txt
      - test -f machinery-card-generator/SKILL.md
      - test -d machinery-card-generator/tests
      - 'test -z "$(git status --porcelain)"'

  - name: project-tests
    image: python:3.12-alpine
    commands:
      - pip install --no-cache-dir -r requirements-validation.txt
      - python3 -m unittest discover -s machinery-card-generator/tests -p 'test_*.py'

concurrency: 1
